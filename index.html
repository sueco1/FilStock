<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filament Tracker</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- Cache-busting: a fresh ?v= on every page load, so edited CSS/JS always shows up. -->
  <script>document.write('<link rel="stylesheet" href="styles.css?v=' + Date.now() + '">');</script>
</head>
<body>
  <header class="app-header">
    <h1>Filament</h1>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab is-active" role="tab" id="tab-btn-inventory" aria-selected="true" aria-controls="tab-inventory" data-tab="inventory">Inventory</button>
      <button class="tab" role="tab" id="tab-btn-prints" aria-selected="false" aria-controls="tab-prints" data-tab="prints">Print log</button>
    </nav>
  </header>

  <div id="low-stock" class="low-stock" role="status" aria-live="polite" hidden></div>

  <main>
    <section class="tab-panel is-active" id="tab-inventory" role="tabpanel" aria-labelledby="tab-btn-inventory">

      <form id="add-form" class="add-form" autocomplete="off">
        <div class="field field-colour">
          <label for="add-colour">Colour</label>
          <div class="colour-input">
            <input type="color" id="add-hex" value="#2f9e44" aria-label="Pick colour shade">
            <input type="text" id="add-colour" placeholder="e.g. Green" required maxlength="40">
          </div>
        </div>
        <div class="field">
          <label for="add-material">Material</label>
          <input type="text" id="add-material" list="material-options" value="PLA" required maxlength="20">
          <datalist id="material-options">
            <option value="PLA"></option>
            <option value="PLA+"></option>
            <option value="PETG"></option>
            <option value="ABS"></option>
            <option value="ASA"></option>
            <option value="TPU"></option>
            <option value="Nylon"></option>
            <option value="PC"></option>
          </datalist>
        </div>
        <div class="field field-qty">
          <label for="add-qty">Rolls</label>
          <input type="number" id="add-qty" min="1" max="50" step="1" value="1" required>
        </div>
        <div class="field field-weight">
          <label for="add-capacity">Weight (g)</label>
          <input type="number" id="add-capacity" min="1" max="10000" step="1" value="1000" required>
        </div>
        <button type="submit" class="btn btn-primary">Add sealed roll</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>

      <div class="toolbar">
        <p id="summary" class="summary"></p>
        <div class="filters">
          <label class="threshold" for="threshold">Low stock under
            <input type="number" id="threshold" min="0" step="10" value="150"> g
          </label>
          <input type="search" id="search" placeholder="Search colour or material" aria-label="Search inventory">
          <select id="material-filter" aria-label="Filter by material">
            <option value="">All materials</option>
          </select>
        </div>
      </div>

      <div id="inventory-list"></div>
    </section>

    <section class="tab-panel" id="tab-prints" role="tabpanel" aria-labelledby="tab-btn-prints">
      <form id="print-form" class="add-form" autocomplete="off">
        <div class="field field-roll">
          <label for="print-roll">Roll</label>
          <select id="print-roll"></select>
        </div>
        <div class="field field-weight">
          <label for="print-grams">Used (g)</label>
          <input type="number" id="print-grams" min="1" step="1" required>
        </div>
        <div class="field field-name">
          <label for="print-name">Print name (optional)</label>
          <input type="text" id="print-name" maxlength="60">
        </div>
        <button type="submit" class="btn btn-primary">Log print</button>
      </form>
      <p id="print-status" class="status" role="status" aria-live="polite"></p>

      <div class="toolbar">
        <p id="print-summary" class="summary"></p>
      </div>
      <div id="print-list"></div>
      <p class="hint">Removing a log entry doesn't put the filament back on the roll.</p>
    </section>
  </main>

  <script>document.write('<script src="app.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
